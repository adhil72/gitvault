name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v2.0.0)
        required: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tag.outputs.release }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(grep '^version = ' Cargo.toml | head -n1 | cut -d'"' -f2)
          tag="${INPUT_TAG:-v$version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$INPUT_TAG" ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          if [ -z "$INPUT_TAG" ]; then
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/gitvault" dist/gitvault
          tar -C dist -czf "gitvault-${{ matrix.target }}.tar.gz" gitvault
      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/gitvault.exe" dist/gitvault.exe
          Compress-Archive -Path dist/gitvault.exe -DestinationPath "gitvault-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: gitvault-${{ matrix.target }}.${{ matrix.ext }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      PUBLIC_REPO: adhil72/gitvault-website
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --latest --title "GitVault $TAG" \
            --notes "GitVault $TAG — Pure CLI, Zero .env, Powered by git and gh. Verify with \`sha256sum -c SHA256SUMS --ignore-missing\`." \
            artifacts/*
      - name: Mirror release to public website repo
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::WEBSITE_TOKEN is not set; skipping mirror to $PUBLIC_REPO"
            exit 0
          fi
          gh release create "$TAG" --repo "$PUBLIC_REPO" --latest --title "GitVault $TAG" \
            --notes "GitVault $TAG CLI binaries. Verify with \`sha256sum -c SHA256SUMS --ignore-missing\`." \
            artifacts/*
