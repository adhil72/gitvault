name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Create the draft once so the parallel platform builds only upload assets to it.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # The updater compares this version with the running app, so it must match the tag.
      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json version $version"
            exit 1
          fi
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "GitVault $TAG" \
            --notes "See the assets below to download GitVault for your platform."
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "map(select(.tag_name==\"$TAG\"))[0].id")
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest LTS keeps the glibc requirement low
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Optional: signs the Windows installers when a certificate is configured.
      # Without the secrets the build still works but SmartScreen warns users.
      - name: Import Windows code-signing certificate
        id: winsign
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "::warning::WINDOWS_CERTIFICATE is not set; Windows installers will be unsigned"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = Join-Path $env:RUNNER_TEMP 'signing.json'
          @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 5 | Set-Content $config
          "args=--config $config" >> $env:GITHUB_OUTPUT
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts (.sig); the app verifies them with the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # latest.json is built in the publish job so its URLs point at the public releases repo.
          includeUpdaterJson: false
          args: --bundles ${{ matrix.bundles }} ${{ steps.winsign.outputs.args }}

  # The source repository is private, so installers and the update feed are
  # copied to a public releases repository (as a draft: publishing stays manual).
  publish:
    needs: [create-release, release]
    runs-on: ubuntu-latest
    env:
      PUBLIC_REPO: adhil72/gitvault-releases
    steps:
      - name: Download the built assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          mkdir dist
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | "\(.id) \(.name)"' | while read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "dist/$name"
          done
          ls -l dist
      - name: Write checksums and the update feed
        run: |
          cd dist
          version="${TAG#v}"
          base="https://github.com/$PUBLIC_REPO/releases/download/$TAG"
          exe=$(ls ./*-setup.exe | head -n1 | xargs basename)
          appimage=$(ls ./*.AppImage | head -n1 | xargs basename)
          jq -n --arg version "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg exe_url "$base/$exe" --arg exe_sig "$(cat "$exe.sig")" \
            --arg app_url "$base/$appimage" --arg app_sig "$(cat "$appimage.sig")" \
            '{version: $version, pub_date: $date, notes: "",
              platforms: {
                "windows-x86_64": {signature: $exe_sig, url: $exe_url},
                "linux-x86_64": {signature: $app_sig, url: $app_url}
              }}' > latest.json
          sha256sum -- *.exe *.msi *.deb *.AppImage > SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft release in the public repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASES_TOKEN is not set; nothing was copied to $PUBLIC_REPO"
            exit 0
          fi
          cd dist
          gh release create "$TAG" --repo "$PUBLIC_REPO" --draft --title "GitVault $TAG" \
            --notes "Verify downloads with \`sha256sum -c SHA256SUMS --ignore-missing\`." \
            ./*.exe ./*.exe.sig ./*.msi ./*.deb ./*.AppImage ./*.AppImage.sig latest.json SHA256SUMS
