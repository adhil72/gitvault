[package]
name = "gitvault"
version = "2.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
description = "Zero-.env encrypted secrets CLI powered exclusively by git and gh."

[workspace]

[[bin]]
name = "gitvault"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
hkdf = "0.12"
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
too_many_arguments = "deny"
too_many_lines = "warn"
cognitive_complexity = "warn"
