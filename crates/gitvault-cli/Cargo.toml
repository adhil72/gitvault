[package]
name = "gitvault-cli"
description = "The `gitvault` command-line interface. Calls the same services as the desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "gitvault"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
clap_complete = "4"
gitvault-core.workspace = true
gitvault-infra.workspace = true
rpassword = "7"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
